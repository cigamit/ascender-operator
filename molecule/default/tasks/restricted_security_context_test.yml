---
# The molecule AWX spec sets restricted_security_context: true, so the web and
# task deployments must satisfy the Pod Security Admission "restricted" standard:
# every container and initContainer drops all capabilities and disables
# privilege escalation, and the pods run as non-root with the RuntimeDefault
# seccomp profile.
- name: Validate restricted securityContext
  block:
    - name: Get the web and task deployments
      k8s_info:
        namespace: '{{ namespace }}'
        api_version: apps/v1
        kind: Deployment
        label_selectors:
          - 'app.kubernetes.io/name in (example-awx-web, example-awx-task)'
      register: restricted_deployments

    - name: Assert both the web and task deployments were found
      ansible.builtin.assert:
        that:
          - restricted_deployments.resources | length == 2
        fail_msg: 'expected 2 deployments (web, task), found {{ restricted_deployments.resources | length }}'

    - name: Assert each pod runs as non-root with the RuntimeDefault seccomp profile
      ansible.builtin.assert:
        that:
          - item.spec.template.spec.securityContext.runAsNonRoot | bool
          - item.spec.template.spec.securityContext.seccompProfile.type == 'RuntimeDefault'
        fail_msg: '{{ item.metadata.name }} pod securityContext is not restricted-compliant'
      loop: '{{ restricted_deployments.resources }}'
      loop_control:
        label: '{{ item.metadata.name }}'

    - name: Assert every container drops all capabilities and disables privilege escalation
      ansible.builtin.assert:
        that:
          - item.1.securityContext.allowPrivilegeEscalation == false
          - "'ALL' in item.1.securityContext.capabilities.drop"
        fail_msg: 'container {{ item.1.name }} is not restricted-compliant'
      loop: '{{ restricted_deployments.resources | subelements("spec.template.spec.containers") }}'
      loop_control:
        label: '{{ item.1.name }}'

    - name: Assert every initContainer drops all capabilities and disables privilege escalation
      ansible.builtin.assert:
        that:
          - item.1.securityContext.allowPrivilegeEscalation == false
          - "'ALL' in item.1.securityContext.capabilities.drop"
        fail_msg: 'initContainer {{ item.1.name }} is not restricted-compliant'
      loop: '{{ restricted_deployments.resources | subelements("spec.template.spec.initContainers", skip_missing=True) }}'
      loop_control:
        label: '{{ item.1.name }}'
