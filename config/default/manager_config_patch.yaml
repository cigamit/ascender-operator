apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: ascender-manager
        args:
        - "--config=controller_manager_config.yaml"
        volumeMounts:
        - name: ascender-manager-config
          mountPath: /controller_manager_config.yaml
          subPath: controller_manager_config.yaml
      volumes:
      - name: ascender-manager-config
        configMap:
          name: ascender-manager-config
